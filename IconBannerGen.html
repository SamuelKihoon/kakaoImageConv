<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Overlay and Resize</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin-top: 50px;
        }
        .left-section, .right-section {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .left-section {
            align-items: center;
        }
        #dropZone {
            width: 100%;
            height: 150px;
            border: 2px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        #dropZone:hover {
            border-color: #007bff;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        select {
            background: #f9f9f9;
            border: 1px solid #ccc;
        }
        button {
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        canvas {
            border-radius: 8px;
            border: 1px solid #ddd;
            max-width: 100%;
        }
    
        .right-section {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    
        #controls label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, button {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="file"] {
            padding: 10px;
            font-size: 14px;
        }
        input[type="color"] {
            padding: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        canvas {
            display: block;
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        #downloadLink {
            display: block;
            margin-top: 10px;
            text-align: center;
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        }
    
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
    
    <body>
    
        <div class="container">
            <div class="left-section">
                <label for="dropZone">Drag and drop an image to merge with an overlay, then resize to 512x512:</label>
                <div id="dropZone">Drop image here</div>
                <select id="overlaySelect">
                    <option value="stack1.png">TALK 1 블랙</option>
                    <option value="stack2.png">TALK 2 화이트</option>
                    <option value="stack3.png">TALK 3</option>
                    <option value="stack4.png">TALK</option>
                </select>
                <canvas id="previewCanvas" width="512" height="512"></canvas>
                <button id="downloadMerged" >Download Merged Image</button>
                <button id="downloadResized">이미지 다운로드</button>
            </div>
    
            <div class="right-section">
                <div id="container">
                    <div id="controls">
                        <label for="iconUpload">Upload Icon:</label>
                        <input type="file" id="iconUpload" accept="image/*">
            
                        <label for="textInput">Enter Text:</label>
                        <input type="text" id="textInput">
            
                        <label for="bgColor">Select Background Color:</label>
                        <input type="color" id="bgColor" value="#FFFFFF">
            
                        <button onclick="generateImage()">Generate Image</button>
                    </div>
                    <canvas id="canvas" width="1024" height="500"></canvas>
                    <a id="downloadLink" download="PlayPanner.png">플레이배너 다운로드</a>
                </div>
            </div>
        </div>



<script>
    function generateImage() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const text = document.getElementById('textInput').value;
        const iconInput = document.getElementById('iconUpload');
        const iconFile = iconInput.files[0];
        const bgColor = document.getElementById('bgColor').value;
        
        if (!iconFile) {
            alert('Please upload an icon.');
            return;
        }
    
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
    
                // Draw selected background color
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
    
                // Draw icon with border radius
                const iconSize = 150; // Adjust size as needed
                const iconX = (canvas.width - iconSize) / 2;
                const iconY = (canvas.height - iconSize) / 2 - 50; // Adjusted to move up
    
                
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(iconX + 12, iconY);
                ctx.arcTo(iconX + iconSize, iconY, iconX + iconSize, iconY + iconSize, 12);
                ctx.arcTo(iconX + iconSize, iconY + iconSize, iconX, iconY + iconSize, 12);
                ctx.arcTo(iconX, iconY + iconSize, iconX, iconY, 12);
                ctx.arcTo(iconX, iconY, iconX + iconSize, iconY, 12);
                ctx.clip();
                ctx.drawImage(img, iconX, iconY, iconSize, iconSize);
                ctx.restore();
    
                // Draw text
                ctx.fillStyle = "#000000";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText(text, canvas.width / 2, iconY + iconSize + 30); // Adjusted to move up
    
                // Create download link
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = canvas.toDataURL('image/png');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(iconFile);
    }
     
    
</script>



    <script>
        document.getElementById("downloadMerged").style.display = "none";


        
        const dropZone = document.getElementById('dropZone');
        const canvas = document.getElementById('canvas');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const previewCtx = previewCanvas.getContext('2d');
        const overlaySelect = document.getElementById('overlaySelect');
        let uploadedImage = null;
        let overlayImage = new Image();
        
        function loadDefaultOverlay() {
            overlayImage.src = `/iconres/${overlaySelect.value}`;
            overlayImage.onload = () => {
                previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                previewCtx.drawImage(overlayImage, 0, 0, 512, 512);
            };
        }
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'blue';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#aaa';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#aaa';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImage = new Image();
                    uploadedImage.onload = renderPreview;
                    uploadedImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        overlaySelect.addEventListener('change', renderPreview);

        function renderPreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            
            if (uploadedImage) {
                previewCtx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
            
            overlayImage.src = `/iconres/${overlaySelect.value}`;
            overlayImage.onload = () => {
                previewCtx.drawImage(overlayImage, 0, 0, 512, 512);
            };
        }

        document.getElementById('downloadMerged').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (uploadedImage) {
                ctx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
            ctx.drawImage(overlayImage, 0, 0, 512, 512);
            const link = document.createElement('a');
            link.download = 'MergedImage.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        document.getElementById('downloadResized').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'ResizedImage.png';
            link.href = previewCanvas.toDataURL();
            link.click();
        });
        
        window.onload = loadDefaultOverlay;
    </script>
</body>
</html>
