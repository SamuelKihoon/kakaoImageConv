<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카톡 이미지 생성기</title>
    <style>
        #kingButton {
          background-color: #007bff; /* 파란색 */
          color: white; /* 텍스트 색상 */
          border: none; /* 테두리 없음 */
          padding: 10px 20px; /* 내부 여백 */
          font-size: 16px; /* 글꼴 크기 */
          cursor: pointer; /* 커서 모양 */
          border-radius: 4px; /* 둥근 테두리 */
        }
        </style>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .header {
            width: 100%;
            background-color: #ddd;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 600px;
        }
        .top-row, .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            max-height: 55px;
            gap: 5px;
            flex: 1;
        }
        .middle-section, .single-large-zone { flex: 2; }
        .bottom-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            flex: 1;
        }
          .middle-section {
        display: flex;
        flex-direction: row; /* 가로 배치 */
        gap: 5px; /* 요소 간 간격 */
    }
        .large-zone, .button-zone, .single-large-zone {
            border: 2px dashed #aaa;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            min-height: 65px;
            flex: 1;
            cursor: grab;
            position: relative;
        }
        .dragging {
            opacity: 0.5;
        }
        .image-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
      .bottom-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
}

.bottom-grid .large-zone {
    aspect-ratio: 1 / 1; /* 정사각형 유지 */
    max-width: 75px; /* 최대 너비 45px */
    max-height: 75px; /* 최대 높이 45px */
}

.single-large-zone {
    flex-grow: 1; /* Stretch 효과 */
    height: 900px;
    max-width: 400px; /* 최대 너비 400px */
    max-height: 900px; /* 최대 높이 400px */
    width: 100%; /* 부모 크기에 맞춤 */
    height: auto;
}
      .spacebar-zone {
    width: 100%; /* Stretch */
    max-height: 45px; /* 최대 높이 */
    min-height: 45px; /* 최소 높이 45px */
    height: 100%;
    border: 2px dashed #aaa;
    background-color: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    overflow: hidden;
}
.spacebar-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

      
      
    </style>
</head>
<body>
    <div class="header">
        <span style="float: left;">카톡 이미지 생성기</span>
        <div style="float: right;">
            <button id="kingButton" onclick="downloadAllImages()">The King :: All download</button>
            <button id="kingButton" onclick="window.open('PlayBannerMaker.html')" style="background: #0b004b;">플레이 배너 메이커</button>
        </div>
        <div style="clear: both;"></div>
    </div>
    
 

    
    <div class="container">
        <div class="card">
            <div class="top-row">
                <div class="large-zone" draggable="true" id="Pf1">프사1</div>
                <div class="large-zone" draggable="true" id="Pf2">프사2</div>
                <div class="large-zone" draggable="true" id="Pf3">프사3</div>
                <div class="large-zone" draggable="true" id="Icon">아이콘</div>
            </div>
            <div class="middle-section">
                <div class="large-zone" draggable="true" id="BG1">Splash_intro(1)</div>
                <div class="large-zone" draggable="true" id="BG2">채팅괴 메인BG(2)</div>
            </div>
          <div class="spacebar-zone" draggable="true" id="Spacebar">Spacebar</div>



          


            <div class="bottom-buttons">
                <div class="button-zone" draggable="true" id="BF1">BF1</div>
                <div class="button-zone" draggable="true" id="BF2">BF2</div>
                <div class="button-zone" draggable="true" id="BF3">BF3</div>
                <div class="button-zone" draggable="true" id="BF4">BF4</div>
                <div class="button-zone" draggable="true" id="BF5">BF5</div>
                <div class="button-zone" draggable="true" id="AF1">AF1</div>
                <div class="button-zone" draggable="true" id="AF2">AF2</div>
                <div class="button-zone" draggable="true" id="AF3">AF3</div>
                <div class="button-zone" draggable="true" id="AF4">AF4</div>
                <div class="button-zone" draggable="true" id="AF5">AF5</div>
            </div>
        </div>
        <div class="card">
            <div class="single-large-zone" draggable="true" id="Pwd_BG">패스코드 배경</div>
            <div class="bottom-grid">
                <div class="large-zone" draggable="true" id="PwBF1">비번전1</div>
                <div class="large-zone" draggable="true" id="PwBF2">비번전2</div>
                <div class="large-zone" draggable="true" id="PwBF3">비번전3</div>
                <div class="large-zone" draggable="true" id="PwBF4">비번전4</div>
            </div>
            <div class="bottom-grid">
                <div class="large-zone" draggable="true" id="PwAF1">비번후1</div>
                <div class="large-zone" draggable="true" id="PwAF2">비번후2</div>
                <div class="large-zone" draggable="true" id="PwAF3">비번후3</div>
                <div class="large-zone" draggable="true" id="PwAF4">비번후4</div>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.large-zone, .button-zone, .single-large-zone, .spacebar-zone').forEach(zone => {
            zone.addEventListener('dragover', (event) => {
                event.preventDefault();
                zone.style.backgroundColor = '#d3d3d3';  // 드래그 중 배경색 변경
            });

            zone.addEventListener('dragleave', () => {
                zone.style.backgroundColor = '#f9f9f9';  // 드래그 나갈 때 배경색 원래대로
            });

            zone.addEventListener('drop', (event) => {
                event.preventDefault();
                zone.style.backgroundColor = '#f9f9f9';  // 드롭 후 배경색 원래대로

                const file = event.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        zone.innerHTML = `<img src="${e.target.result}" width="100%" height="100%" style="object-fit: cover;">`;  // 이미지 삽입
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert("이미지 파일만 업로드 가능합니다.");
                }
            });
        });
    </script>


 


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dropZones = document.querySelectorAll(".large-zone");
    
            dropZones.forEach(zone => {
                zone.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    zone.style.border = "2px dashed blue";
                });
    
                zone.addEventListener("dragleave", () => {
                    zone.style.border = "none";
                });
    
                zone.addEventListener("drop", (e) => {
                    e.preventDefault();
                    zone.style.border = "none";
    
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith("image/")) {
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            let img = zone.querySelector("img");
                            if (!img) {
                                img = document.createElement("img");
                                img.style.width = "100%";
                                img.style.height = "100%";
                                zone.innerHTML = "";
                                zone.appendChild(img);
                            }
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            });
        });
    </script>
    <script>
        async function downloadAllImages() {
            const images = [
            { selector: '#Pf1 img', filename: 'theme_profile_01_image.png', width: 500, height: 500 },
            { selector: '#Pf2 img', filename: 'theme_profile_02_image.png', width: 500, height: 500 },
            { selector: '#Pf3 img', filename: 'theme_profile_03_image.png', width: 500, height: 500 },
            { selector: '#Icon img', filename: 'appicon.png', width: 512, height: 512 },
            { selector: '#BG1 img', filename: 'theme_splash_image.png', width: 640, height: 1240 },
            { selector: '#BG2 img', filename: 'theme_background_image.png', width: 640, height: 1240 },
            { selector: '#BG2 img', filename: 'theme_chatroom_background_image.png', width: 640, height: 1240 },
            { selector: '#Spacebar img', filename: 'theme_maintab_cell_image.png', width: 1440, height: 212 },
            { selector: '#BF1 img', filename: 'theme_maintab_ico_friends_image.png', width: 440, height: 440 },
            { selector: '#BF2 img', filename: 'theme_maintab_ico_chats_image.png', width: 440, height: 440 },
            { selector: '#BF3 img', filename: 'theme_maintab_ico_openchat_image.png', width: 440, height: 440 },
            { selector: '#BF4 img', filename: 'theme_maintab_ico_shopping_image.png', width: 440, height: 440 },
            { selector: '#BF5 img', filename: 'theme_maintab_ico_more_image.png', width: 440, height: 440 },
            { selector: '#AF1 img', filename: 'theme_maintab_ico_friends_focused_image.png', width: 440, height: 440 },
            { selector: '#AF2 img', filename: 'theme_maintab_ico_chats_focused_image.png', width: 440, height: 440 },
            { selector: '#AF3 img', filename: 'theme_maintab_ico_openchat_focused_image.png', width: 440, height: 440 },
            { selector: '#AF4 img', filename: 'theme_maintab_ico_shopping_focused_image.png', width: 440, height: 440 },
            { selector: '#AF5 img', filename: 'theme_maintab_ico_more_focused_image.png', width: 440, height: 440 },
            { selector: '#Pwd_BG img', filename: 'theme_passcode_background_image.png', width: 1000, height: 1000 },
            { selector: '#PwBF1 img', filename: 'theme_passcode_01_image.png', width: 200, height: 200 },
            { selector: '#PwBF2 img', filename: 'theme_passcode_02_image.png', width: 200, height: 200 },
            { selector: '#PwBF3 img', filename: 'theme_passcode_03_image.png', width: 200, height: 200 },
            { selector: '#PwBF4 img', filename: 'theme_passcode_04_image.png', width: 200, height: 200 },
            { selector: '#PwAF1 img', filename: 'theme_passcode_01_checked_image.png', width: 200, height: 200 },
            { selector: '#PwAF2 img', filename: 'theme_passcode_02_checked_image.png', width: 200, height: 200 },
            { selector: '#PwAF3 img', filename: 'theme_passcode_03_checked_image.png', width: 200, height: 200 },
            { selector: '#PwAF4 img', filename: 'theme_passcode_04_checked_image.png', width: 200, height: 200 }
        ];
    
            const zip = new JSZip();
            let hasImages = false;
    
            for (let imgData of images) {
                const imgElement = document.querySelector(imgData.selector);
                if (imgElement && imgElement.src) {
                    const response = await fetch(imgElement.src);
                    const blob = await response.blob();
                    const img = new Image();
                    img.src = URL.createObjectURL(blob);
                    
                    await new Promise(resolve => img.onload = resolve);
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = imgData.width;
                    canvas.height = imgData.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, imgData.width, imgData.height);
                    
                    const resizedBlob = await new Promise(resolve => canvas.toBlob(resolve));
                    zip.file(imgData.filename, resizedBlob);
                    hasImages = true;
                }
            }
    
            if (!hasImages) {
                alert('No images to download. Please drag and drop images first.');
                return;
            }
    
            zip.generateAsync({ type: "blob" }).then(content => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                a.download = '카톡이미지변환-모음.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    


</body>
</html>
