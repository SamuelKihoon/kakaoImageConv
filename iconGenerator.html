<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Overlay and Resize</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f0f0f0;
        }
        #container {
            display: flex;
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
        }
        #leftPanel {
            width: 50%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #rightPanel {
            width: 50%;
            border-left: 1px solid #ccc;
        }
        #dropZone {
            width: 300px;
            height: 150px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #overlaySelect, #previewCanvas, #downloadButtons {
            margin-bottom: 10px;
        }
        canvas {
            border: 1px solid black;
            display: block;
        }
    </style>
</head>
<body>
    <div id="header">
        <span>이미지 변환기</span>
        <div>
            <button>Other Page</button>
            <button>⬇</button>
        </div>
    </div>
    <div id="container">
        <div id="leftPanel">
            <label for="dropZone">Drop image here:</label>
            <div id="dropZone">Drop image here</div>
            <div>
                <button value="stack1.png">Stack1</button>
                <button value="stack2.png">Stack2</button>
                <button value="stack3.png">Stack3</button>
                <button value="stack4.png">Stack4</button>
            </div>
            <canvas id="previewCanvas" width="512" height="512"></canvas>
            <div id="downloadButtons">
                <button id="downloadMerged">Download Merged Image</button>
                <button id="downloadResized">Download Resized Image</button>
            </div>
        </div>
        <div id="rightPanel"></div>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        let uploadedImage = null;
        let overlayImage = new Image();
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'blue';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImage = new Image();
                    uploadedImage.onload = renderPreview;
                    uploadedImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function renderPreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            if (uploadedImage) {
                previewCtx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
        }

        document.getElementById('downloadMerged').addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            if (uploadedImage) {
                ctx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
            ctx.drawImage(overlayImage, 0, 0, 512, 512);
            const link = document.createElement('a');
            link.download = 'MergedImage.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        document.getElementById('downloadResized').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'ResizedImage.png';
            link.href = previewCanvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
