<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Overlay and Resize</title>
    <style>
        #dropZone {
            width: 300px;
            height: 200px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #overlaySelect, #previewCanvas {
            margin-bottom: 10px;
        }
        canvas {
            border: 1px solid black;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <label for="dropZone">Drag and drop an image to merge with an overlay, then resize to 512x512:</label>
            <div id="dropZone">Drop image here</div>
            <select id="overlaySelect">
                <option value="stack1.png">Overlay 1</option>
                <option value="stack2.png">Overlay 2</option>
                <option value="stack3.png">Overlay 3</option>
                <option value="stack4.png">Overlay 4</option>
            </select>
            <canvas id="previewCanvas" width="512" height="512"></canvas>
            <button id="downloadMerged">Download Merged Image</button>
            <button id="downloadResized">Download Resized Image</button>
        </div>
        <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const canvas = document.getElementById('canvas');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const previewCtx = previewCanvas.getContext('2d');
        const overlaySelect = document.getElementById('overlaySelect');
        let uploadedImage = null;
        let overlayImage = new Image();
        
        function loadDefaultOverlay() {
            overlayImage.src = `/demores/${overlaySelect.value}`;
            overlayImage.onload = () => {
                previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                previewCtx.drawImage(overlayImage, 0, 0, 512, 512);
            };
        }
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'blue';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImage = new Image();
                    uploadedImage.onload = renderPreview;
                    uploadedImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        overlaySelect.addEventListener('change', renderPreview);

        function renderPreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            
            if (uploadedImage) {
                previewCtx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
            
            overlayImage.src = `/demores/${overlaySelect.value}`;
            overlayImage.onload = () => {
                previewCtx.drawImage(overlayImage, 0, 0, 512, 512);
            };
        }

        document.getElementById('downloadMerged').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (uploadedImage) {
                ctx.drawImage(uploadedImage, 0, 0, 512, 512);
            }
            ctx.drawImage(overlayImage, 0, 0, 512, 512);
            const link = document.createElement('a');
            link.download = 'MergedImage.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        document.getElementById('downloadResized').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'ResizedImage.png';
            link.href = previewCanvas.toDataURL();
            link.click();
        });
        
        window.onload = loadDefaultOverlay;
    </script>
</body>
</html>
